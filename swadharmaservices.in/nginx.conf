worker_processes  1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # panchanga.json is 133 KB of a single year's tables and every visitor to
    # /calendar or the request wizard fetches it. Gzipped it is around a fifth
    # of that. The stylesheet and the scripts benefit for the same reason.
    # gzip_comp_level 5 rather than the default 1: these are static files built
    # once, so spending a little more CPU per response is free in practice.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    # gzip_proxied is the line that actually makes this work here. Cloud Run
    # terminates TLS and forwards to this container with a Via header, so nginx
    # treats every request as proxied — and the default, `gzip_proxied off`,
    # means it compresses none of them. Without this the block above is inert:
    # panchanga.json went out at its full 146 KB with no Content-Encoding.
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    server {
        # Cloud Run always sends traffic to $PORT, which is 8080 here.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Every add_header lives in this block, not in `location /`.
        # nginx does not merge add_header across levels: one add_header inside a
        # location silently discards every header inherited from the server. The
        # previous revision had Cache-Control in the location block, so moving
        # the security headers up here without moving that one too would have
        # left the site with no security headers at all.

        # 5 minutes, matching what the previous revision served. Short on purpose:
        # signup.html carries the API base URL and the checkout wiring, so a long
        # cache would keep sending people at a retired endpoint after a fix.
        add_header Cache-Control "public, max-age=300" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # The site is served only over HTTPS (Cloud Run and the custom domain
        # both terminate TLS), so there is no plain-HTTP listener to lock out.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # frame-ancestors, not X-Frame-Options: signup.html and enrol.html take
        # payment and personal details, and neither is ever meant to be embedded.
        #
        # The rest is drawn from what the pages actually do. Every script and
        # stylesheet is same-origin: the rewired pages load /app.css, /app.js,
        # /catalogue.js and their page script, all covered by 'self'.
        #
        # 'unsafe-inline' is still needed, but only for the pages the rewire did
        # not touch — manual, enrol, signup, privacy and classes still carry
        # inline <script> and <style>. Dropping it means externalising those
        # first, which is a separate change; the generated pages would already
        # pass without it.
        #
        # img-src names dharmaposhanam.in because the favicon is served from
        # there. Without it the browser blocks the icon and the tab shows the
        # default page glyph — which is what happened before this line, quietly.
        #
        # TWO backends now appear in connect-src:
        #   swadharma-api — index, enrol and signup (professional enrolment,
        #                   account signup)
        #   vitta-api     — classes.html only (Sanskrit Classes payment gateway:
        #                   region-tiered student enrolment + sponsorships)
        # The vitta-api origin here MUST match the API_BASE constant in
        # classes.html. If they drift, the browser blocks every call from that
        # page and it shows only "Could not load rates".
        #
        # Note the gateway redirect survives this: signup.html and classes.html
        # hand off with a top-level navigation to the Stripe/Razorpay URL, which
        # form-action does not govern.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://dharmaposhanam.in; connect-src 'self' https://swadharma-api-332912113546.asia-south1.run.app https://vitta-api-lcglwq774q-uc.a.run.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ── Routes ──────────────────────────────────────────────────────
        # The rewire uses intent-shaped URLs (spec section 10), and every page
        # is a flat file at the document root, matching what the Dockerfile
        # copies. These blocks are the only place the two are reconciled.
        #
        # /services/<slug> is served by ONE file. service.html reads the slug
        # off location.pathname and renders from catalogue.js, so adding a
        # service needs no nginx change and no new file. The cost is that the
        # <title> and description are set by script rather than in the markup.
        location ^~ /services/ {
            try_files /service.html =404;
        }

        # Territory paths below /territories all resolve to the browser page,
        # which reads the selection out of the query string.
        location ^~ /territories/ {
            try_files /territories.html =404;
        }

        # Two real pages under /network. Exact matches, so /network itself and
        # anything unrecognised still fall through to the generic handler and
        # 404 honestly instead of silently serving the wrong page.
        location = /network/professionals {
            try_files /network-professionals.html =404;
        }
        location = /network/temples {
            try_files /network-temples.html =404;
        }

        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
