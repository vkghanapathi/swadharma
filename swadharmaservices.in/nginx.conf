worker_processes  1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    server {
        # Cloud Run always sends traffic to $PORT, which is 8080 here.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Every add_header lives in this block, not in `location /`.
        # nginx does not merge add_header across levels: one add_header inside a
        # location silently discards every header inherited from the server. The
        # previous revision had Cache-Control in the location block, so moving
        # the security headers up here without moving that one too would have
        # left the site with no security headers at all.

        # 5 minutes, matching what the previous revision served. Short on purpose:
        # signup.html carries the API base URL and the checkout wiring, so a long
        # cache would keep sending people at a retired endpoint after a fix.
        add_header Cache-Control "public, max-age=300" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # The site is served only over HTTPS (Cloud Run and the custom domain
        # both terminate TLS), so there is no plain-HTTP listener to lock out.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # frame-ancestors, not X-Frame-Options: signup.html and enrol.html take
        # payment and personal details, and neither is ever meant to be embedded.
        #
        # The rest is drawn from what the pages actually do. There are no
        # external scripts, stylesheets or fonts — every asset is same-origin —
        # and the only network calls are the three inline scripts in index,
        # enrol and signup talking to swadharma-api. 'unsafe-inline' is required
        # because those scripts and the page styles are inline; removing it means
        # hashing or externalising them first, which is a separate change.
        #
        # Note the gateway redirect survives this: signup.html hands off with
        # `location.href = <Stripe/Razorpay URL>`, a top-level navigation, which
        # form-action does not govern.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://swadharma-api-332912113546.asia-south1.run.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
