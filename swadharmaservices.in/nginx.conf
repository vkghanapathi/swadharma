worker_processes  1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    server {
        # Cloud Run always sends traffic to $PORT, which is 8080 here.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 5 minutes, matching what the previous revision served. Short on purpose:
        # signup.html carries the API base URL and the checkout wiring, so a long
        # cache would keep sending people at a retired endpoint after a fix.
        location / {
            add_header Cache-Control "public, max-age=300";
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
